# One-off, NOT synced by ArgoCD: copies CTFd uploads from the old ReadWriteOnce volume
# (ctfd-storage) to the shared one (ctfd-shared). Run once the new CTFd pods are up and the
# old pod is gone:
#   kubectl apply -f code/k8s/migrations/ctfd-uploads-to-rwx.yaml
#   kubectl -n ctf wait --for=condition=complete job/ctfd-uploads-to-rwx --timeout=10m
# Never overwrites files that already exist on the new volume.
apiVersion: batch/v1
kind: Job
metadata:
  name: ctfd-uploads-to-rwx
  namespace: ctf
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: copy
          image: alpine:3.20
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /new/uploads
              cp -Rpn /old/uploads/. /new/uploads/ || true
              chown -R 1001:1001 /new/uploads
              # Fail if any old file did not make it.
              cd /old/uploads
              find . -type f | while read -r f; do
                [ -f "/new/uploads/$f" ] || { echo "missing: $f"; exit 1; }
              done
              echo "All files copied."
          volumeMounts:
            - { name: old, mountPath: /old, readOnly: true }
            - { name: new, mountPath: /new }
      volumes:
        - name: old
          persistentVolumeClaim: { claimName: ctfd-storage }
        - name: new
          persistentVolumeClaim: { claimName: ctfd-shared }
