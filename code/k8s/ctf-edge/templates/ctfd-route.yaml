{{- if include "ctf-edge.tls" . }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: {{ .Release.Namespace }}
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ctfd-http
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints: [web]
  routes:
    - kind: Rule
      match: Host(`{{ .Values.domain }}`)
      middlewares:
        - name: redirect-https
      services:
        - name: {{ .Values.ctfd.service }}
          port: {{ .Values.ctfd.port }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: {{ .Release.Namespace }}
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: false
    contentTypeNosniff: true
    referrerPolicy: strict-origin-when-cross-origin
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ctfd
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`{{ .Values.domain }}`)
      middlewares:
        - name: security-headers
      services:
        - name: {{ .Values.ctfd.service }}
          port: {{ .Values.ctfd.port }}
  tls:
    secretName: ctf-tls
{{- else }}
# No domain/ACME configured: plain HTTP, any host (lab setup).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ctfd
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints: [web]
  routes:
    - kind: Rule
      match: {{ if .Values.domain }}Host(`{{ .Values.domain }}`){{ else }}PathPrefix(`/`){{ end }}
      services:
        - name: {{ .Values.ctfd.service }}
          port: {{ .Values.ctfd.port }}
{{- end }}
