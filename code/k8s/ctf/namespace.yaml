apiVersion: v1
kind: Namespace
metadata:
  name: ctf
  labels:
    kubernetes.io/metadata.name: ctf
    # Required on Talos Linux so kCTF nsjail challenge containers can create sandbox namespaces
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged

