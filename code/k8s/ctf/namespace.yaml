# Trusted platform workloads: CTFd, chall-manager, sync Job.
apiVersion: v1
kind: Namespace
metadata:
  name: ctf
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  labels:
    kubernetes.io/metadata.name: ctf
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
# Build infrastructure: registry, registry-cache and rootless buildkitd (build-infra.yaml).
# Not "baseline" because rootless buildkitd needs unconfined seccomp/AppArmor; nothing here is
# privileged or mounts host paths.
apiVersion: v1
kind: Namespace
metadata:
  name: ctf-build
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  labels:
    kubernetes.io/metadata.name: ctf-build
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
# Untrusted, player-facing challenge instances (created by chall-manager).
# baseline blocks privileged/hostPath/hostNetwork/hostPort/added caps; restricted is only
# audited because sshd/su/priv-esc challenges legitimately need root inside the container.
apiVersion: v1
kind: Namespace
metadata:
  name: ctf-challenges
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  labels:
    kubernetes.io/metadata.name: ctf-challenges
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: metallb-system
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  labels:
    kubernetes.io/metadata.name: metallb-system
    # Required on Talos Linux so metallb-speaker can use hostNetwork and ARP/NDP raw sockets
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: spegel
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  labels:
    kubernetes.io/metadata.name: spegel
    # Required on Talos Linux so Spegel can access host containerd socket & content store
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  labels:
    kubernetes.io/metadata.name: longhorn-system
    # Longhorn manager/CSI pods need privileged mode and host mounts
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
