apiVersion: v1
kind: Namespace
metadata:
  name: ctf
  labels:
    kubernetes.io/metadata.name: ctf
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: metallb-system
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  labels:
    kubernetes.io/metadata.name: metallb-system
    # Required on Talos Linux so metallb-speaker can use hostNetwork and ARP/NDP raw sockets
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: spegel
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  labels:
    kubernetes.io/metadata.name: spegel
    # Required on Talos Linux so Spegel can access host containerd socket & content store
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
