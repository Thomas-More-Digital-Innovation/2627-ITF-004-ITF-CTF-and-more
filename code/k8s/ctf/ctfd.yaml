apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ctfd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.pascaliske.dev
    chart: ctfd
    targetRevision: 2.0.0
    helm:
      valuesObject:
        image:
          registry: docker.io
          repository: ctferio/ctfd
          tag: "3.8.6-0.10.1"
        controller:
          replicas: 1
        service:
          type: ClusterIP
        ports:
          http:
            enabled: true
            port: 8000
        ingressRoute:
          create: true
          entryPoints:
            - web
          rule: Host(`ctf.local`) || PathPrefix(`/`)
        # Disabled until a StorageClass is provisioned on the Talos cluster
        persistentVolumeClaim:
          create: false
        env:
          - name: TZ
            value: UTC
          - name: DATABASE_URL
            value: sqlite:////data/ctfd.db
          - name: UPLOAD_FOLDER
            value: /var/uploads
          - name: LOG_FOLDER
            value: /var/log/CTFd
          - name: REVERSE_PROXY
            value: "true"
          - name: PLUGIN_SETTINGS_CM_API_URL
            value: http://chall-manager.ctf.svc.cluster.local:8080
        extraInitContainers:
          theme-sync:
            image: alpine/git:v2.45.2
            env:
              - name: HOME
                value: /tmp
            envFrom:
              - secretRef:
                  name: gitlab-credentials
                  optional: true
            command:
              - /bin/sh
              - -c
              - |
                set -e
                AUTH=""
                if [ -n "$GITLAB_TOKEN" ]; then
                  USER="${GITLAB_USERNAME:-oauth2}"
                  AUTH="${USER}:${GITLAB_TOKEN}@"
                fi
                echo "[*] Cloning theme repository..."
                git clone --depth 1 -b A1/bsides-theme https://${AUTH}gitlab.com/it-factory-thomas-more/SKIL3/25-26/bsides-ctf/ctfd-forked.git /tmp/repo
                cp -r /tmp/repo/CTFd/themes/bsides-limburg/. /theme/
                echo "[*] Theme bsides-limburg installed successfully."
            volumeMounts:
              - name: ctfd-theme-bsides
                mountPath: /theme
        extraVolumes:
          - name: ctfd-data
            emptyDir: {}
          - name: ctfd-uploads
            emptyDir: {}
          - name: ctfd-logs
            emptyDir: {}
          - name: ctfd-theme-bsides
            emptyDir: {}
        extraVolumeMounts:
          - name: ctfd-data
            mountPath: /data
          - name: ctfd-uploads
            mountPath: /var/uploads
          - name: ctfd-logs
            mountPath: /var/log/CTFd
          - name: ctfd-theme-bsides
            mountPath: /opt/CTFd/CTFd/themes/bsides-limburg
  destination:
    server: https://kubernetes.default.svc
    namespace: ctf
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

