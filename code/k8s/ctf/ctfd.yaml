apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ctfd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.pascaliske.dev
    chart: ctfd
    targetRevision: 2.0.0
    helm:
      valuesObject:
        image:
          registry: docker.io
          repository: ctferio/ctfd
          tag: "3.8.6-0.10.1"
        controller:
          replicas: 1
          # Uploads live on a ReadWriteOnce volume: the old pod must release it before the new one starts.
          updateStrategy:
            type: Recreate
        service:
          type: ClusterIP
        ports:
          http:
            enabled: true
            port: 8000
        # Routing (HTTP, or HTTPS with a cert-manager certificate when a domain is configured)
        # lives in the ctf-edge chart (code/k8s/ctf-edge), which the backend deploys with the domain.
        ingressRoute:
          create: false
        # SECRET_KEY and DATABASE_URL come from the ctfd-secrets Secret created by the backend's
        # Pulumi program. The values here are placeholders: the chart only uses the keys.
        secret:
          create: false
          existingSecret: ctfd-secrets
          values:
            SECRET_KEY: from-secret
            DATABASE_URL: from-secret
        # Uploads and logs on Longhorn (the chart mounts <mountPath>/uploads and <mountPath>/logs
        # and sets UPLOAD_FOLDER / LOG_FOLDER accordingly).
        persistentVolumeClaim:
          create: true
          mountPath: /var/ctfd
          accessMode: ReadWriteOnce
          size: 5Gi
          storageClassName: longhorn
        env:
          - name: TZ
            value: UTC
          - name: REVERSE_PROXY
            value: "true"
          - name: PLUGIN_SETTINGS_CM_API_URL
            value: http://chall-manager.ctf.svc.cluster.local:8080
        extraInitContainers:
          theme-sync:
            image: alpine/git:v2.45.2
            env:
              - name: HOME
                value: /tmp
            command:
              - /bin/sh
              - -c
              - |
                set -e
                echo "[*] Cloning theme from repository..."
                git clone --depth 1 --filter=blob:none --sparse https://github.com/Thomas-More-Digital-Innovation/2627-ITF-004-ITF-CTF-and-more.git /tmp/repo
                cd /tmp/repo
                git sparse-checkout set code/themes/bsides-limburg
                cp -r code/themes/bsides-limburg/. /theme/
                echo "[*] Theme bsides-limburg installed successfully."
            volumeMounts:
              - name: ctfd-theme-bsides
                mountPath: /theme
        extraVolumes:
          - name: ctfd-theme-bsides
            emptyDir: {}
        extraVolumeMounts:
          - name: ctfd-theme-bsides
            mountPath: /opt/CTFd/CTFd/themes/bsides-limburg
  destination:
    server: https://kubernetes.default.svc
    namespace: ctf
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff: { duration: 30s, factor: 2, maxDuration: 10m }

