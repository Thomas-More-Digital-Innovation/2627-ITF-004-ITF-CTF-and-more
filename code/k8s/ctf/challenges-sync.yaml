# Challenge sync pipeline. Source: code/ctf-sync/
#
#   ctf-sync-image  (hook, every ArgoCD sync)  builds code/ctf-sync from GitHub on the shared
#                   buildkitd and pushes registry.ctf-build.svc.cluster.local/ctf/ctf-sync:latest
#   ctfd-bootstrap  (hook, every ArgoCD sync)  CTFd /setup, admin token -> Secret ctfd-admin-token,
#                   theme. Idempotent.
#   ctf-sync        (CronJob)                   GitLab challenges repo -> builds -> CTFd. Exits in
#                   about a second when the repo hasn't changed. Run it now with:
#                     kubectl -n ctf create job --from=cronjob/ctf-sync sync-now
#                   Force a full re-sync with FORCE_SYNC=true (edit the CronJob or the Job).
apiVersion: batch/v1
kind: Job
metadata:
  name: ctf-sync-image
  namespace: ctf
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: { app.kubernetes.io/name: ctf-sync }
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: build
          image: moby/buildkit:v0.16.0
          command: ["buildctl"]
          args:
            - --addr
            - tcp://buildkitd.ctf-build.svc.cluster.local:1234
            - build
            - --frontend
            - dockerfile.v0
            - --opt
            - context=https://github.com/Thomas-More-Digital-Innovation/2627-ITF-004-ITF-CTF-and-more.git#HEAD:code/ctf-sync
            - --output
            - type=image,name=registry.ctf-build.svc.cluster.local/ctf/ctf-sync:latest,push=true
            - --progress
            - plain
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ctfd-bootstrap
  namespace: ctf
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 5
  template:
    metadata:
      labels: { app.kubernetes.io/name: ctf-sync }
    spec:
      serviceAccountName: ctf-sync
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: registry.ctf-build.svc.cluster.local/ctf/ctf-sync:latest
          imagePullPolicy: Always
          args: ["ctf_sync.bootstrap"]
          envFrom:
            - secretRef: { name: gitlab-credentials, optional: true }
          env:
            - { name: CTFD_URL, value: "http://ctfd-web.ctf.svc.cluster.local:8000" }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ctf-sync-repo
  namespace: ctf
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn-single
  resources:
    requests:
      storage: 5Gi
---
# Which challenges are containerized, and how to run them. A `deploy:` block with the same
# keys inside a challenge's challenge.yml overrides its entry here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ctf-sync-challenges
  namespace: ctf
data:
  dynamic-challenges.yaml: |
    - { path: "Team A1/The-13th-Cabin", port: 5000 }
    - { path: "Team A1/camp-forest-green-found-footage", context: web, port: 5000 }
    - { path: "Team A1/crystal_lake", port: 80 }
    - { path: "Team A1/devils-jackpot", port: 5000 }
    - { path: "Team A1/flappy bird", port: 80 }
    - { path: "Team A1/linux-jail-escape", context: jail, port: 80, command: ["/usr/local/bin/ttyd", "-p", "80", "su", "-", "prisoner"] }
    - { path: "Team A1/path-traversal-challenge", port: 3000 }
    - { path: "Team A1/physical_puzzle", port: 80 }
    - { path: "Team A1/spectral-challenge", context: web, port: 5000 }
    - { path: "Team A1/whitespace-challenge", context: web, port: 80 }
    - { path: "Team A2/windows master quest", port: 5000 }
    - { path: "Team A3/Misc_Character_Guessing", context: assets, port: 3000 }
    - { path: "Team A3/PWN_Priv_Escalation_Part-1", context: assets, port: 22, protocol: ssh }
    - { path: "Team A3/PWN_Priv_Escalation_Part-2", context: assets, port: 22, protocol: ssh }
    - { path: "Team A3/Web_Client_Auth", context: assets, port: 80 }
    - { path: "Team A3/Web_Command_Injection", context: assets, port: 5000 }
    - { path: "Team A3/Web_Redirecting", context: assets, port: 3000 }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ctf-sync
  namespace: ctf
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  schedule: "*/5 * * * *"
  # The repo PVC is ReadWriteOnce and runs must not interleave.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels: { app.kubernetes.io/name: ctf-sync }
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
            - name: sync
              image: registry.ctf-build.svc.cluster.local/ctf/ctf-sync:latest
              imagePullPolicy: Always
              args: ["ctf_sync.sync"]
              envFrom:
                - secretRef: { name: gitlab-credentials, optional: true }
              env:
                - { name: CTFD_URL, value: "http://ctfd-web.ctf.svc.cluster.local:8000" }
                - { name: CHALLENGE_HOST, value: "10.100.0.21" }
                - { name: CHALLENGES_BRANCH, value: "" } # empty = repo default branch
                - { name: FORCE_SYNC, value: "false" }
                - { name: BUILD_CONCURRENCY, value: "4" }
                - name: CTFD_TOKEN
                  valueFrom:
                    secretKeyRef: { name: ctfd-admin-token, key: token, optional: true }
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { memory: 1Gi }
              volumeMounts:
                - { name: data, mountPath: /data }
                - { name: challenges, mountPath: /config }
          volumes:
            - name: data
              persistentVolumeClaim: { claimName: ctf-sync-repo }
            - name: challenges
              configMap: { name: ctf-sync-challenges }
