---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chall-manager
  namespace: ctf
  labels:
    app.kubernetes.io/name: chall-manager
    app.kubernetes.io/part-of: ctf-instancer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chall-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chall-manager
        app.kubernetes.io/part-of: ctf-instancer
    spec:
      serviceAccountName: chall-manager
      initContainers:
        - name: scenario-compiler
          image: ctferio/chall-manager:v0.6.6
          command:
            - /bin/sh
            - -ce
            - |
              SCN_DIR="/root/.cache/chall-manager/oci/sha256:1111111111111111111111111111111111111111111111111111111111111111"
              mkdir -p "${SCN_DIR}" /tmp/build
              cp /scenario/Pulumi.yaml "${SCN_DIR}/Pulumi.yaml"
              cp /scenario/main.go /tmp/build/main.go
              cd /tmp/build
              go mod init k8s-monopod
              go get github.com/pulumi/pulumi/sdk/v3@v3.130.0
              CGO_ENABLED=0 go build -o "${SCN_DIR}/main" main.go
              chmod +x "${SCN_DIR}/main"
              CGO_ENABLED=0 go build -o /root/.cache/chall-manager/helper /scenario/helper.go
              chmod +x /root/.cache/chall-manager/helper
          volumeMounts:
            - name: scenario-src
              mountPath: /scenario
            - name: cache
              mountPath: /root/.cache/chall-manager
      containers:
        - name: chall-manager
          image: ctferio/chall-manager:v0.6.6
          env:
            - name: OCI_INSECURE
              value: "true"
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: state
              mountPath: /tmp/chall-manager
            - name: cache
              mountPath: /root/.cache/chall-manager
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 2Gi
        - name: scenario-helper
          image: ctferio/chall-manager:v0.6.6
          command: ["/root/.cache/chall-manager/helper"]
          volumeMounts:
            - name: state
              mountPath: /tmp/chall-manager
            - name: cache
              mountPath: /root/.cache/chall-manager
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: janitor
          image: ctferio/chall-manager-janitor:v0.6.6
          env:
            - name: URL
              value: localhost:8080
            - name: TICKER
              value: 1m
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: state
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: scenario-src
          configMap:
            name: chall-manager-scenario
