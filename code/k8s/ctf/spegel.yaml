# Stateless cluster-local P2P OCI registry mirror (Spegel)
# Peers containerd image layers across all Talos nodes so any image/layer from
# GitLab Registry, Docker Hub, GHCR, etc. is only pulled from upstream once.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spegel
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: ghcr.io/spegel-org/helm-charts
    chart: spegel
    targetRevision: 0.8.0
    helm:
      valuesObject:
        spegel:
          # Talos Linux stores containerd registry mirror configs at /etc/cri/conf.d/hosts
          containerdRegistryConfigPath: /etc/cri/conf.d/hosts
          # Pull order: local containerd store -> Spegel peers -> Talos-managed mirror -> upstream.
          # prependExisting keeps the Talos mirrors (CtfEnvironmentProgram.BuildNodePatch) behind
          # Spegel instead of replacing them:
          #   registry.ctf-build.svc.cluster.local -> in-cluster registry (NodePort 30500)
          #   docker.io                            -> registry-cache (NodePort 30501)
          prependExisting: true
          # Explicit list: with an empty list Spegel only writes _default/hosts.toml, and containerd
          # prefers a registry's own hosts.toml (the Talos ones) over _default, skipping Spegel.
          mirroredRegistries:
            - https://registry.ctf-build.svc.cluster.local
            - https://docker.io
            - https://ghcr.io
            - https://quay.io
            - https://registry.k8s.io
            - https://registry.gitlab.com
            - https://factory.talos.dev
  destination:
    server: https://kubernetes.default.svc
    namespace: spegel
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

